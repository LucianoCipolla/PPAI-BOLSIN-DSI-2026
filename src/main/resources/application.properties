spring.application.name=bolsines
server.port=8080

# Persistencia: Hibernate + H2 en archivo
spring.datasource.url=jdbc:h2:file:./data/bolsines
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# El gestor recorre cambioEstado (lazy) durante el request
spring.jpa.open-in-view=true

# Consola H2 en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sin esto el navegador reutiliza JS y CSS viejos despues de recompilar
spring.web.resources.cache.cachecontrol.no-store=true

# Mapa: si esta vacia se usa Leaflet + OpenStreetMap
google.maps.api-key=

# GPS Tracker: API de la catedra o simulador propio
gps.base-url=http://localhost:8080/simulador-gps
gps.simulador.habilitado=true
gps.url.xtr4500l=${gps.base-url}/xtr4500l
gps.url.navtrack=${gps.base-url}/navtrack
gps.url.geopulse=${gps.base-url}/geopulse
gps.clave.xtr4500l=clave-xtr-g5
gps.clave.navtrack=clave-navtrack-g5
gps.clave.geopulse=clave-geopulse-g5
