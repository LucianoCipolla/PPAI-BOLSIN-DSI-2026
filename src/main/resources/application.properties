spring.application.name=bolsines
server.port=8081

# Persistencia: Hibernate + H2 en archivo
spring.datasource.url=jdbc:h2:file:./data/bolsines
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# El gestor recorre cambioEstado (lazy) durante el request
spring.jpa.open-in-view=true

# Consola H2 en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sin esto el navegador reutiliza JS y CSS viejos despues de recompilar
spring.web.resources.cache.cachecontrol.no-store=true

# Mapa: si esta vacia se usa Leaflet + OpenStreetMap
google.maps.api-key=

# GPS Tracker: API provista por la catedra (repo dsi-api-bolsines), corre aparte en el 8080
gps.base-url=http://localhost:8080/api
gps.url.xtr4500l=${gps.base-url}/xtr-4500l
gps.url.navtrack=${gps.base-url}/navtrack-qx-7a
gps.url.geopulse=${gps.base-url}/geopulse-mtr-900
gps.clave.xtr4500l=sk_xtr_9F3a7C21bE6d4A10f2c8e5b7d913
gps.clave.navtrack=sk_nav_7b61d9e4c3a2485fae10c77d5b2f
gps.clave.geopulse=sk_geo_f2d84a1c9e7345b8a6d1c3f0972e